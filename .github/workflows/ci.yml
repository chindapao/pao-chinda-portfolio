# Quality gates for every pull request and every push to dev / sit. Vercel's GitHub integration builds the preview /
# production deployment separately; these jobs make a red check visible on the PR before anyone merges.
name: CI

on:
  push:
    branches: [dev, sit]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    name: E2E · accessibility · Lighthouse
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Dummy values: they make the contact form render so it can be tested. The tests stub /api/contact, so nothing
      # is ever sent to Resend.
      RESEND_API_KEY: re_ci_dummy
      CONTACT_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (e2e + axe, desktop and 360 px phone, English and Khmer)
        run: pnpm test:e2e
      - name: Lighthouse budget (desktop, gating)
        run: pnpm exec lhci autorun
      - name: Lighthouse report (mobile, informational)
        run: pnpm exec lhci autorun --config=lighthouserc.mobile.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
